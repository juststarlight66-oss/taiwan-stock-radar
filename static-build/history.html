<!DOCTYPE html>
<html lang="zh-TW" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>歷史查詢 | 台灣股市雷達</title>
    <meta name="description" content="AI 台股盤後歷史掃描紀錄與回測結果查詢。">
    <meta name="theme-color" content="#030712">
    <link rel="stylesheet" href="styles.css">
    <style>
        .date-picker-ui {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }
        
        .date-select {
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            border: 1px solid var(--border-color);
            background: var(--card-bg);
            color: var(--text-main);
            font-size: 1rem;
            cursor: pointer;
            outline: none;
            min-width: 15ch;
        }
        
        .date-select:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 2px rgba(14, 165, 233, 0.2);
        }
    </style>
</head>
<body>
    <nav>
        <div class="container nav-content">
            <a href="index.html" class="nav-brand">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--accent-color);"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg>
                台股雷達
            </a>
            <div class="nav-links">
                <a href="index.html" class="nav-link">每日推薦</a>
                <a href="intraday.html" class="nav-link">盤中監控</a>
                <a href="history.html" class="nav-link active">歷史查詢</a>
                <a href="selfcheck.html" class="nav-link">自主檢查</a>
            </div>
            <div class="flex items-center gap-4">
                <div id="status-indicator" class="timestamp">
                    <span class="badge badge-sky">載入中...</span>
                </div>
                <button class="theme-toggle" aria-label="切換主題">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="moon-icon" style="display: none;"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="sun-icon"><circle cx="12" cy="12" r="5"/><path d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72 1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
                </button>
            </div>
        </div>
    </nav>

    <main class="container">
        <!-- Hero / Date Picker -->
        <div class="hero">
            <div>
                <h1 class="hero-title">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-accent"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></svg>
                    歷史紀錄查詢
                </h1>
                <p class="hero-subtitle mb-4">查詢過往掃描結果與推薦標的。</p>
                
                <div class="date-picker-ui">
                    <label for="date-select" class="font-bold">選擇日期：</label>
                    <select id="date-select" class="date-select">
                        <option value="">載入中...</option>
                    </select>
                    <div id="bt-status"></div>
                </div>
            </div>
        </div>

        <div id="error-container"></div>

        <div id="content-area" style="display: none;">
            <!-- summary-section -->
            <div id="summary-section" class="summary-grid">
                <!-- Generated by JS -->
            </div>

            <!-- top10-section -->
            <h2 class="text-lg font-bold mb-4 mt-6 flex items-center gap-2">
                當日推薦 TOP 10
            </h2>
            <div class="table-container">
                <table id="top10-table">
                    <thead>
                        <tr>
                            <th style="width: 50px; text-align: center;">名次</th>
                            <th>標的</th>
                            <th style="text-align: right;">收盤</th>
                            <th style="text-align: right;">漲跌</th>
                            <th style="text-align: right;">總分</th>
                            <th>策略</th>
                            <th>動能雷達</th>
                        </tr>
                    </thead>
                    <tbody id="top10-body">
                        <!-- Generated by JS -->
                    </tbody>
                </table>
            </div>

            <!-- explode-section -->
            <div id="explode-container" style="display: none;">
                <h2 class="text-lg font-bold mb-4 mt-6 flex items-center gap-2">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-up"><path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/><path d="m12 15-3-3a22 22 0 0 1 3.88-9L14 1.5l2.42 2.42A22 22 0 0 1 12 15z"/><path d="m18 10 4 4"/><path d="m15 13 4 4"/></svg>
                    當日爆發潛力股
                </h2>
                <div id="explode-section" class="summary-grid" style="grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));">
                    <!-- Generated by JS -->
                </div>
            </div>
        </div>
    </main>

    <!-- Modal Form -->
    <div class="modal-overlay" id="detail-modal">
        <div class="modal-content">
            <button class="modal-close" aria-label="關閉">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
            </button>
            <div id="modal-body"></div>
        </div>
    </div>

    <!-- Mobile Nav -->
    <div class="mobile-nav">
        <a href="index.html" class="mobile-nav-link">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg>
            推薦
        </a>
        <a href="intraday.html" class="mobile-nav-link">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
            盤中
        </a>
        <a href="history.html" class="mobile-nav-link active">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></svg>
            歷史
        </a>
        <a href="selfcheck.html" class="mobile-nav-link">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="m9 11 3 3L22 4"/></svg>
            檢查
        </a>
    </div>

    <script src="app.js"></script>
    <script>
        let availableDates = [];
        let backtestData = null;

        document.addEventListener('DOMContentLoaded', async () => {
            APP.initModals();

            // Toggle sun/moon icon based on theme
            const updateIcons = () => {
                const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
                document.querySelectorAll('.sun-icon').forEach(el => el.style.display = isDark ? 'none' : 'block');
                document.querySelectorAll('.moon-icon').forEach(el => el.style.display = isDark ? 'block' : 'none');
            };
            updateIcons();
            document.querySelectorAll('.theme-toggle').forEach(btn => btn.addEventListener('click', updateIcons));

            // Setup select handler
            document.getElementById('date-select').addEventListener('change', (e) => {
                if (e.target.value) {
                    loadDateData(e.target.value);
                }
            });

            await initHistory();
        });

        async function initHistory() {
            try {
                // Fetch index
                const indexData = await APP.fetchJSON(`${APP.DATA_PREFIX}/index.json`);
                availableDates = indexData.dates || [];
                
                if (!availableDates.length) {
                    throw new Error("No dates available in index.json");
                }

                // Try fetching backtest data (optional)
                try {
                    backtestData = await APP.fetchJSON(`${APP.DATA_PREFIX}/backtest.json`);
                } catch (e) {
                    console.log("No backtest data found");
                }

                // Populate select
                const select = document.getElementById('date-select');
                select.innerHTML = availableDates.map(d => {
                    const label = d.length === 8 ? `${d.substring(0,4)}/${d.substring(4,6)}/${d.substring(6,8)}` : d;
                    return `<option value="${d}">${label}</option>`;
                }).join('');

                // Load first date
                loadDateData(availableDates[0]);

            } catch (err) {
                console.error(err);
                document.getElementById('status-indicator').innerHTML = `<span class="badge badge-red">索引載入失敗</span>`;
                document.getElementById('date-select').innerHTML = `<option value="">請重新整理</option>`;
                document.getElementById('date-select').disabled = true;
            }
        }

        async function loadDateData(dateStr) {
            document.getElementById('status-indicator').innerHTML = `<span class="badge badge-sky">載入中...</span>`;
            document.getElementById('content-area').style.display = 'none';
            document.getElementById('error-container').innerHTML = '';
            
            try {
                const data = await APP.fetchJSON(`${APP.DATA_PREFIX}/scan_result_${dateStr}.json`);
                renderPage(data, dateStr);
                document.getElementById('status-indicator').innerHTML = `<span class="badge badge-emerald">已載入</span>`;
                document.getElementById('content-area').style.display = 'block';
                
                // Show backtest info if available
                if (backtestData && backtestData.date === dateStr) {
                    const winRate = APP.formatPercent(backtestData.win_rate * 100);
                    document.getElementById('bt-status').innerHTML = `
                        <span class="badge badge-amber flex items-center gap-1">
                            回測勝率 ${winRate}
                        </span>
                    `;
                } else {
                    document.getElementById('bt-status').innerHTML = '';
                }

            } catch (err) {
                console.error(err);
                document.getElementById('status-indicator').innerHTML = `<span class="badge badge-red">資料載入失敗</span>`;
                document.getElementById('error-container').innerHTML = `
                    <div class="error-banner">
                        <div>無法載入 ${dateStr} 的掃描資料</div>
                    </div>
                `;
            }
        }

        let currentStocks = [];

        function renderPage(data, dateStr) {
            currentStocks = data.top10 || data.top_stocks || [];

            renderSummary(data);
            renderTop10(currentStocks);
            
            const explode = data.explode_top5 || [];
            if (explode.length > 0) {
                document.getElementById('explode-container').style.display = 'block';
                renderExplode(explode);
            } else {
                document.getElementById('explode-container').style.display = 'none';
            }
        }

        function renderSummary(data) {
            const summary = data.market_summary || {};
            const avgScore = APP.formatNumber(summary.avg_score, 1);
            const bullish = summary.bullish_count || 0;
            const bearish = summary.bearish_count || 0;
            const flat = summary.flat_count || ((data.scanned_count || 0) - bullish - bearish);

            document.getElementById('summary-section').innerHTML = `
                <div class="card">
                    <div class="text-xs text-muted mb-2">平均得分</div>
                    <div class="text-2xl font-bold">${avgScore}</div>
                </div>
                <div class="card">
                    <div class="text-xs text-muted mb-2">多頭排列</div>
                    <div class="text-2xl font-bold text-up">${bullish}</div>
                </div>
                <div class="card">
                    <div class="text-xs text-muted mb-2">空頭排列</div>
                    <div class="text-2xl font-bold text-down">${bearish}</div>
                </div>
                <div class="card">
                    <div class="text-xs text-muted mb-2">盤整震盪</div>
                    <div class="text-2xl font-bold text-muted">${flat}</div>
                </div>
            `;
        }

        function renderTop10(stocks) {
            const tbody = document.getElementById('top10-body');
            
            if (!stocks.length) {
                tbody.innerHTML = `<tr><td colspan="7" style="text-align: center; padding: 2rem; color: var(--text-muted);">該日無推薦標的</td></tr>`;
                return;
            }

            tbody.innerHTML = stocks.map((stock, i) => {
                const close = APP.formatNumber(stock.close);
                const changePct = stock.change_pct;
                const changeClass = APP.getChangeClass(changePct);
                const colorClass = APP.getScoreColorClass(stock.total_score || 0, 100);
                const pct = Math.min(((stock.total_score || 0) / 100) * 100, 100);

                const s = stock.strategy || {};
                const entry = (s.entry_low && s.entry_high) ? `${s.entry_low}–${s.entry_high}` : (s.entry_low || s.entry_high || '—');

                return `
                    <tr class="clickable" onclick="openStockModal(${i})">
                        <td style="text-align: center;">
                            <div class="badge ${i < 3 ? 'badge-amber' : 'badge-sky'}">${i + 1}</div>
                        </td>
                        <td>
                            <div class="font-bold text-base flex items-center gap-2">
                                ${stock.name} 
                                <span class="text-xs text-muted font-normal">${stock.stock_id}</span>
                            </div>
                            <div class="text-xs text-muted mt-1">${stock.market} · ${stock.sector}</div>
                        </td>
                        <td style="text-align: right;" class="font-medium">${close}</td>
                        <td style="text-align: right;" class="${changeClass} font-medium">${APP.formatPercent(changePct)}</td>
                        <td style="text-align: right;">
                            <div class="score-bar-wrapper justify-end">
                                <div class="score-bar-track">
                                    <div class="score-bar-fill ${colorClass}" style="width: ${pct}%"></div>
                                </div>
                                <span class="font-bold" style="width: 24px;">${Math.round(stock.total_score || 0)}</span>
                            </div>
                        </td>
                        <td>
                            <div class="text-xs text-muted"> <span class="text-up font-medium">進場</span> ${entry}</div>
                            <div class="text-xs text-muted"> <span class="text-down font-medium">停損</span> ${s.stop_loss || stock.stop_loss || '—'}</div>
                        </td>
                        <td style="text-align: center;">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-light"><polygon points="3 6 9 6 12 11 18 3 21 3" /><line x1="3" y1="11" x2="9" y2="11" /><line x1="3" y1="16" x2="6" y2="16" /><line x1="3" y1="21" x2="4" y2="21" /></svg>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function renderExplode(stocks) {
            const container = document.getElementById('explode-section');
            container.innerHTML = stocks.map(stock => {
                const prob = stock.explode_prob ? stock.explode_prob * 100 : 0;
                return `
                    <div class="card flex-col gap-2">
                        <div class="flex justify-between items-center">
                            <span class="font-bold">${stock.name} <span class="text-xs text-muted font-normal">${stock.stock_id}</span></span>
                            <span class="badge badge-red">爆發</span>
                        </div>
                        <div class="flex justify-between items-center text-sm">
                            <span class="text-muted">收盤價</span>
                            <span class="font-medium">${APP.formatNumber(stock.close)}</span>
                        </div>
                        <div class="flex justify-between items-center text-sm">
                            <span class="text-muted">機率</span>
                            <span class="font-bold text-up">${APP.formatNumber(prob, 1)}%</span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function openStockModal(index) {
            const stock = currentStocks[index];
            if (!stock) return;

            const close = APP.formatNumber(stock.close);
            const changeClass = APP.getChangeClass(stock.change_pct);
            const colorClass = APP.getScoreColorClass(stock.total_score || 0, 100);
            
            const s = stock.strategy || {};
            const t = stock.targets || {};
            const entryLow = s.entry_low || stock.entry_low;
            const entryHigh = s.entry_high || stock.entry_high;
            const entry = (entryLow && entryHigh) ? `${entryLow}–${entryHigh}` : (entryLow || entryHigh || '—');
            const f = stock.fundamentals || {};
            
            const sigs = stock.signals || [];
            let sigHtml = sigs.length ? sigs.map(sig => `<div class="text-sm py-1 border-b" style="border-color: var(--border-color);">${sig}</div>`).join('') : '<div class="text-sm text-muted">無明顯訊號</div>';

            const html = `
                <div class="flex justify-between items-start mb-6 pr-6">
                    <div>
                        <h2 class="text-2xl font-bold flex items-center gap-2">
                            ${stock.name} <span class="text-lg text-muted font-normal">${stock.stock_id}</span>
                        </h2>
                        <div class="text-sm text-muted mt-1">${stock.market} · ${stock.sector}</div>
                    </div>
                    <div class="text-right">
                        <div class="text-2xl font-bold">${close}</div>
                        <div class="text-sm font-medium ${changeClass}">${APP.formatPercent(stock.change_pct)}</div>
                    </div>
                </div>

                <div class="summary-grid" style="margin-bottom: 2rem;">
                    <div class="card flex items-center justify-center flex-col">
                        <div class="text-xs text-muted mb-1">五維雷達</div>
                        <canvas id="radar-${stock.stock_id}" width="200" height="200" class="radar-container"></canvas>
                        <div class="mt-2 text-xl font-bold ${colorClass.replace('bg-', 'text-')}">${Math.round(stock.total_score || 0)} 分</div>
                    </div>
                    
                    <div class="card flex flex-col gap-4">
                        <div>
                            <div class="text-xs text-muted font-bold mb-2 uppercase">交易策略</div>
                            <div class="grid" style="grid-template-columns: 1fr 1fr; gap: 0.5rem; font-size: 0.875rem;">
                                <div class="text-muted">建議進場</div>
                                <div class="text-up font-bold text-right">${entry}</div>
                                <div class="text-muted">防守停損</div>
                                <div class="text-down font-bold text-right">${s.stop_loss || t.stop_loss || stock.stop_loss || '—'}</div>
                                <div class="text-muted">目標一 (T1)</div>
                                <div class="text-accent font-medium text-right">${t.t1 || s.target1 || '—'}</div>
                                <div class="text-muted">目標二 (T2)</div>
                                <div class="text-accent font-medium text-right">${t.t2 || s.target2 || '—'}</div>
                                <div class="text-muted">目標三 (T3)</div>
                                <div class="text-accent font-medium text-right">${t.t3 || s.target3 || '—'}</div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="summary-grid">
                    <div class="card">
                        <div class="text-xs text-muted font-bold mb-2 uppercase">觸發訊號</div>
                        ${sigHtml}
                    </div>
                    
                    <div class="card">
                        <div class="text-xs text-muted font-bold mb-2 uppercase">基本面指標</div>
                        <div class="flex flex-col gap-2">
                            <div class="flex justify-between text-sm">
                                <span class="text-muted">本益比 (PE)</span>
                                <span>${f.pe || '—'}</span>
                            </div>
                            <div class="flex justify-between text-sm">
                                <span class="text-muted">股價淨值比 (PB)</span>
                                <span>${f.pb || '—'}</span>
                            </div>
                            <div class="flex justify-between text-sm">
                                <span class="text-muted">殖利率 (Yield)</span>
                                <span>${APP.formatPercent(f.dy)}</span>
                            </div>
                        </div>
                        <div class="mt-4 pt-4 border-t" style="border-color: var(--border-color);">
                            <div class="flex justify-between items-center">
                                <span class="text-sm font-bold">系統評級</span>
                                <span class="badge ${stock.recommendation === '強烈推薦' ? 'badge-red' : 'badge-sky'}">${stock.recommendation || s.advice || '推薦'}</span>
                            </div>
                            <div class="text-xs text-muted mt-2 text-right">建議持有: ${s.hold_days || '3-5日'}</div>
                        </div>
                    </div>
                </div>
            `;

            document.getElementById('modal-body').innerHTML = html;
            APP.openModal('detail-modal');

            setTimeout(() => {
                APP.drawRadarChart(`radar-${stock.stock_id}`, stock.dimensions || {});
            }, 50);
        }
    </script>
</body>
</html>
