name: Deploy Next.js to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate all_stocks_index.json
        run: |
          python3 - << 'EOF'
          import json, os
          src = 'public/data/all_scores.json'
          dst = 'public/data/all_stocks_index.json'
          if not os.path.exists(src):
              exit(0)
          with open(src, 'r', encoding='utf-8') as f:
              data = json.load(f)
          if isinstance(data, list):
              stocks = data
              scan_date = ''
              scanned_count = len(stocks)
          else:
              stocks = data.get('all_stock_scores', data.get('stocks', []))
              scan_date = data.get('scan_date', '')
              scanned_count = data.get('scanned_count', len(stocks))
          index = {
              'scan_date': scan_date,
              'scanned_count': scanned_count,
              'stocks': [{
                  'stock_id': s.get('stock_id', ''),
                  'name': s.get('stock_name', s.get('name', '')),
                  'sector': s.get('sector', ''),
                  'close': s.get('close', 0),
                  'change_pct': s.get('change_pct', 0),
                  'total_score': s.get('total_score', 0),
                  'recommendation': s.get('recommendation', ''),
              } for s in stocks]
          }
          with open(dst, 'w', encoding='utf-8') as f:
              json.dump(index, f, ensure_ascii=False, separators=(',', ':'))
          print(f'[ok] {len(index["stocks"])} stocks indexed')
          EOF

      - name: Enrich latest.json with strategy/targets/explode_prob
        continue-on-error: true
        run: |
          python3 << 'PYEOF'
          import json, os, math

          print("Enriching latest.json with computed strategy, targets, and explode probabilities...")

          with open('public/data/latest.json') as f:
              data = json.load(f)

          def compute_targets(close, atr_est=None):
              if atr_est is None or atr_est <= 0:
                  atr_est = max(close * 0.025, 1.0) if close > 0 else 5.0
              return {
                  'entry_low': round(close - 0.5 * atr_est, 2),
                  'entry_high': round(close + 0.5 * atr_est, 2),
                  'stop_loss': round(close - 2.0 * atr_est, 2),
                  'target1': round(close + 1.5 * atr_est, 2),
                  'target2': round(close + 3.0 * atr_est, 2),
                  'target3': round(close + 5.0 * atr_est, 2),
                  'upside': round(1.5 * atr_est / close * 100, 1) if close > 0 else 0,
                  'upside2': round(3.0 * atr_est / close * 100, 1) if close > 0 else 0,
                  'upside3': round(5.0 * atr_est / close * 100, 1) if close > 0 else 0,
                  'downside': round(2.0 * atr_est / close * 100, 1) if close > 0 else 0,
                  'atr': round(atr_est, 2),
              }

          def compute_recommendation(score, upside, downside):
              if score >= 85:
                  strength = '\u2605 \u5f37\u529b\u8cb7\u9032'
              elif score >= 75:
                  strength = '\u8cb7\u9032'
              elif score >= 65:
                  strength = '\u9022\u4f4e\u5e03\u5c40'
              elif score >= 50:
                  strength = '\u89c0\u671b'
              else:
                  strength = '\u8ff4\u907f'
              if upside > 0 and downside > 0:
                  rr = upside / downside
                  return f'{strength} | \u98a8\u96aa\u5831\u916c\u6bd4 {rr:.1f}:1'
              return strength

          def pick_score(s):
              # v2 scan payloads carry 'score'; older payloads carried 'total_score'.
              for key in ('score', 'total_score', 'weighted_score', 'final_score'):
                  v = s.get(key)
                  if isinstance(v, (int, float)):
                      return float(v)
              return 50.0

          def pick_number(*candidates, fallback=None):
              for v in candidates:
                  if isinstance(v, (int, float)) and v > 0:
                      return v
              return fallback

          def enrich_stock(s):
              close = s.get('close') or 0
              score = pick_score(s)
              t = compute_targets(close)
              rec = compute_recommendation(score, t['upside'], t['downside'])

              # The scan already emits its own entry/stop/target numbers and they are
              # internally consistent, so keep them and only fill in what is missing.
              existing = s.get('targets') if isinstance(s.get('targets'), dict) else {}
              entry_low = pick_number(s.get('entry_low'), existing.get('entry_low'), fallback=t['entry_low'])
              entry_high = pick_number(s.get('entry_high'), existing.get('entry_high'), fallback=t['entry_high'])
              stop_loss = pick_number(s.get('stop_loss'), existing.get('stop_loss'), fallback=t['stop_loss'])
              t1 = pick_number(s.get('target1'), existing.get('t1'), existing.get('target1'), fallback=t['target1'])
              t2 = pick_number(s.get('target2'), existing.get('t2'), existing.get('target2'), fallback=t['target2'])
              t3 = pick_number(s.get('target3'), existing.get('t3'), existing.get('target3'), fallback=t['target3'])

              # Keep the scan's own strategy label (e.g. a plain string) instead of dropping it.
              prev_strategy = s.get('strategy')
              label = prev_strategy.get('label') if isinstance(prev_strategy, dict) else prev_strategy

              s['change_pct'] = s.get('change_pct', 0) or 0
              s['entry_low'] = entry_low
              s['entry_high'] = entry_high
              s['stop_loss'] = stop_loss
              s['target1'] = t1
              s['target2'] = t2
              s['target3'] = t3
              s['recommendation'] = rec
              s['targets'] = {
                  't1': t1, 't2': t2, 't3': t3, 'stop_loss': stop_loss,
                  'entry_low': entry_low, 'entry_high': entry_high,
                  'target1': t1, 'target2': t2, 'target3': t3,
                  'upside': t['upside'], 'upside2': t['upside2'], 'upside3': t['upside3'],
                  'downside': t['downside'], 'atr': t['atr'],
              }
              s['strategy'] = {
                  'entry': entry_low, 'entry_low': entry_low,
                  'entry_high': entry_high, 'stop_loss': stop_loss,
                  'target': t1, 'target1': t1,
                  'target2': t2, 'target3': t3,
                  'upside': t['upside'], 'upside2': t['upside2'],
                  'upside3': t['upside3'], 'downside': t['downside'],
                  'atr': t['atr'], 'recommendation': rec,
                  'label': label, 'score': score,
              }
              return s

          top10 = data.get('top10', data.get('top_stocks', []))
          data['top10'] = [enrich_stock(s) for s in top10]
          print(f"Enriched {len(data['top10'])} top10 stocks")

          explode = data.get('explode_top5', [])
          enriched_explode = []
          for s in explode:
              e = enrich_stock(s)
              if e.get('explode_prob') is None:
                  # Keep the scan's own probability when it already computed one.
                  score = pick_score(s)
                  e['explode_prob'] = round(min(0.98, max(0.02, (score - 30) / 70)), 3)
              enriched_explode.append(e)
          data['explode_top5'] = enriched_explode
          print(f"Enriched {len(data['explode_top5'])} explode_top5 stocks")

          tmp = 'public/data/latest.json.tmp'
          with open(tmp, 'w') as f:
              json.dump(data, f, ensure_ascii=False)
          os.replace(tmp, 'public/data/latest.json')
          print("latest.json enriched and saved.")

          # Diagnostic only - a cosmetic print must never fail the deploy step.
          try:
              t = data['top10'][0] if data.get('top10') else {}
              print(f"Sample: #{t.get('stock_id','')} {t.get('name','')} score={t.get('score')} entry={t.get('entry_low')}-{t.get('entry_high')} stop={t.get('stop_loss')} t1={t.get('target1')}")
          except Exception as exc:
              print(f"[warn] sample print skipped: {exc}")
          PYEOF

      - name: Install dependencies
        run: npm ci --no-fund --no-audit

      - name: Build
        run: npm run build

      - name: Add .nojekyll
        run: touch out/.nojekyll

      - name: Configure GitHub Pages
        run: |
          set -e
          echo "Checking if GitHub Pages is configured..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages")
          
          if [ "$HTTP_CODE" = "404" ]; then
            echo "Pages not configured — enabling now..."
            curl -s -X POST \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/pages" \
              -d '{"source":{"branch":"gh-pages","path":"/"}}'
            echo "Pages configured successfully."
          elif [ "$HTTP_CODE" = "200" ]; then
            echo "Pages already configured."
          else
            echo "Unexpected HTTP status: $HTTP_CODE"
          fi

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          publish_branch: gh-pages
          force_orphan: true