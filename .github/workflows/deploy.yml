name: Deploy Next.js to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate all_stocks_index.json
        run: |
          python3 - << 'EOF'
          import json, os
          src = 'public/data/all_scores.json'
          dst = 'public/data/all_stocks_index.json'
          if not os.path.exists(src):
              exit(0)
          with open(src, 'r', encoding='utf-8') as f:
              data = json.load(f)
          if isinstance(data, list):
              stocks = data
              scan_date = ''
              scanned_count = len(stocks)
          else:
              stocks = data.get('all_stock_scores', data.get('stocks', []))
              scan_date = data.get('scan_date', '')
              scanned_count = data.get('scanned_count', len(stocks))
          index = {
              'scan_date': scan_date,
              'scanned_count': scanned_count,
              'stocks': [{
                  'stock_id': s.get('stock_id', ''),
                  'name': s.get('stock_name', s.get('name', '')),
                  'sector': s.get('sector', ''),
                  'close': s.get('close', 0),
                  'change_pct': s.get('change_pct', 0),
                  'total_score': s.get('total_score', 0),
                  'recommendation': s.get('recommendation', ''),
              } for s in stocks]
          }
          with open(dst, 'w', encoding='utf-8') as f:
              json.dump(index, f, ensure_ascii=False, separators=(',', ':'))
          print(f'[ok] {len(index["stocks"])} stocks indexed')
          EOF

      - name: Regenerate latest.json from full scan data
        run: |
          python3 << 'PYEOF'
          import json, os, datetime
          
          with open('public/data/latest.json') as f:
              old_latest = json.load(f)
          old_count = old_latest.get('scanned_count', 0)
          
          if old_count >= 1500:
              print(f"SKIP: latest.json already has {old_count} stocks from scan-daily, no regeneration needed")
              exit(0)
          
          with open('public/data/all_scores.json') as f:
              all_data = json.load(f)
          scores = all_data.get('all_stock_scores', all_data.get('stocks', []))
          print(f"Loaded {len(scores)} stocks from all_scores.json")
          
          if not (1500 <= len(scores) <= 4000):
              print(f"SKIP: all_scores.json has {len(scores)} stocks, outside expected range — keeping existing latest.json")
              exit(0)
          
          top10 = sorted(scores, key=lambda s: s.get('scores', {}).get('total', s.get('total_score', 0)), reverse=True)[:10]
          for s in top10:
              sc = s.get('scores', {})
              s['dimensions'] = {
                  'technical': sc.get('technical', 0),
                  'fundamental': sc.get('fundamental', 0),
                  'news': sc.get('news', 0),
                  'sentiment': sc.get('sentiment', 0),
                  'chips': sc.get('chips', 0),
              }
              s['sector'] = s.get('sector_name', s.get('sector', '其他'))
              s.setdefault('signals', [])
              s.setdefault('strategy', '五維強勢')
          
          sectors = {}
          for s in scores:
              sec = s.get('sector_name', s.get('sector', '其他'))
              sectors.setdefault(sec, []).append(s.get('total_score', s.get('scores', {}).get('total', 0)))
          sector_detail = {sec: {'count': len(v), 'avg_score': round(sum(v)/len(v),1) if v else 0} for sec, v in sectors.items()}
          market_summary = {
              'avg_score': round(sum(s.get('total_score', s.get('scores',{}).get('total',0)) for s in scores)/len(scores), 1) if scores else 0,
              'sectors': len(sectors),
              'sector_detail': sector_detail,
          }
          
          latest = {
              'scan_date': today,
              'scan_date_slash': today_slash,
              'scanned_count': len(scores),
              'generated_at': now,
              'top10': top10,
              'explode_top5': [{
                  **s,
                  'explode_prob': round(min(0.95, max(0.05, (
                      s.get('scores', {}).get('total', s.get('total_score', 50)) / 100
                  ))), 3),
              } for s in top10[:5]],
              'all_stock_scores': scores,
              'market_summary': market_summary,
          }
          
          with open('public/data/latest.json', 'w') as f:
              json.dump(latest, f, ensure_ascii=False)
          print(f"Regenerated latest.json with {len(scores)} stocks")
          PYEOF

      - name: Install dependencies
        run: npm ci --no-fund --no-audit

      - name: Build
        run: npm run build

      - name: Add .nojekyll
        run: touch out/.nojekyll

      - name: Configure GitHub Pages
        run: |
          set -e
          echo "Checking if GitHub Pages is configured..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages")
          
          if [ "$HTTP_CODE" = "404" ]; then
            echo "Pages not configured — enabling now..."
            curl -s -X POST \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/pages" \
              -d '{"source":{"branch":"gh-pages","path":"/"}}'
            echo "Pages configured successfully."
          elif [ "$HTTP_CODE" = "200" ]; then
            echo "Pages already configured."
          else
            echo "Unexpected HTTP status: $HTTP_CODE"
          fi

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          publish_branch: gh-pages
          force_orphan: true