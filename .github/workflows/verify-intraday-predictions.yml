name: "Verify Intraday Predictions"

on:
  workflow_dispatch:
  schedule:
    # Daily 18:30 CST (UTC+8) = 10:30 UTC, Mon-Fri
    - cron: '30 10 * * 1-5'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Checkout gh-pages (read history)
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages-data

      - name: Checkout main (for scripts)
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-repo

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install yfinance

      - name: Capture today's picks
        run: |
          cd main-repo
          cp ../gh-pages-data/data/intraday_predictions_history.json public/data/ 2>/dev/null || true
          cp ../gh-pages-data/data/intraday.json public/data/ 2>/dev/null || true
          python scripts/track_intraday_predictions.py capture public/data/intraday.json public/data/intraday_predictions_history.json

      - name: Run verification
        run: |
          cd main-repo
          python scripts/track_intraday_predictions.py verify

      - name: Push results to gh-pages
        run: |
          cd gh-pages-data
          if [ -f ../main-repo/intraday_predictions_history.json ]; then
            cp ../main-repo/intraday_predictions_history.json data/intraday_predictions_history.json
          fi
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/intraday_predictions_history.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: verify intraday predictions [skip ci]"
            git pull --rebase origin gh-pages || true
            git push origin HEAD:gh-pages
          fi
