name: "Verify Intraday Predictions"

on:
  workflow_dispatch:
  schedule:
    # Daily 18:30 CST (UTC+8) = 10:30 UTC, Mon-Fri
    - cron: '30 10 * * 1-5'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Checkout gh-pages (read history)
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages-data

      - name: Checkout main (for scripts)
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-repo

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install yfinance

      - name: Capture today's picks
        run: |
          cd main-repo
          cp ../gh-pages-data/data/intraday_predictions_history.json public/data/ 2>/dev/null || true
          cp ../gh-pages-data/data/intraday.json public/data/ 2>/dev/null || true
          python scripts/track_intraday_predictions.py capture public/data/intraday.json public/data/intraday_predictions_history.json

      - name: Run verification
        run: |
          cd main-repo
          cp public/data/intraday_predictions_history.json . 2>/dev/null || true
          python scripts/track_intraday_predictions.py verify public/data/intraday_predictions_history.json intraday_predictions_history.json

      - name: Commit results to main
        run: |
          cd main-repo
          if [ -f intraday_predictions_history.json ]; then
            cp intraday_predictions_history.json public/data/intraday_predictions_history.json
          fi
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add public/data/intraday_predictions_history.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: verify intraday predictions"
            git pull --rebase origin main || true
            git push origin HEAD:main
          fi

      - name: Push to gh-pages
        run: |
          cd main-repo
          if [ -f public/data/intraday_predictions_history.json ]; then
            cp public/data/intraday_predictions_history.json /tmp/intraday_hist.json
            git fetch origin gh-pages
            git checkout -B gh-pages origin/gh-pages 2>/dev/null || git checkout gh-pages
            cp /tmp/intraday_hist.json data/intraday_predictions_history.json
            git add data/intraday_predictions_history.json
            if git diff --cached --quiet; then
              echo "No changes to commit (gh-pages)"
            else
              git commit -m "chore: update intraday predictions"
              git push --force origin gh-pages
            fi
          fi
