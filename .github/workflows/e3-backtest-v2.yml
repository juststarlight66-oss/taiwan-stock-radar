name: E3 Backtest V2

on:
  workflow_dispatch:
    inputs:
      strategy:
        description: 'Strategy to run'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - ma_crossover
          - breakout
          - pattern
      symbols:
        description: 'Stock symbols (space-separated)'
        required: false
        default: ''
        type: string
      days:
        description: 'Backtest period in trading days'
        required: false
        default: '252'
        type: string
  schedule:
    # Weekly Friday 22:45 CST (UTC+8) = 14:45 UTC
    - cron: '45 14 * * 5'

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy httpx
      - name: Run E3 Backtest
        run: |
          SYMBOLS_ARG=""
          if [ -n "${{ github.event.inputs.symbols }}" ]; then
            SYMBOLS_ARG="--symbols ${{ github.event.inputs.symbols }}"
          fi
          python backtest_engine.py \
            --strategy ${{ github.event.inputs.strategy || 'all' }} \
            --days ${{ github.event.inputs.days || '252' }} \
            $SYMBOLS_ARG \
            --output e3_backtest_$(date +%Y%m%d).json
      - name: Stage and push results
        if: success()
        run: |
          git config user.name "Nebula Bot"
          git config user.email "noreply@nebula.gg"
          git add e3_backtest_*.json 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "E3 backtest $(date +%Y%m%d)"
            git push origin HEAD:main
          fi

      - name: Stage E3 files for Pages publish
        if: success()
        run: |
          # Publish ONLY this run's E3 output. The repo previously shipped a stale
          # full-site snapshot in ./gh-pages, which this step republished over the
          # live site and clobbered data/latest.json with old data.
          mkdir -p .publish-e3
          cp e3_backtest_*.json .publish-e3/ 2>/dev/null || true

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./.publish-e3
          publish_branch: gh-pages
          keep_files: true
