name: Scan All Stocks
on:
  workflow_dispatch:

jobs:
  scan-all-stocks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run full market scan (with fallback)
        run: python tasks/scan_all_stocks.py
        env:
          OUTPUT_PATH: public/data/all_scores.json
          SCAN_RESULT_PATH: public/data/scan_result.json
          FORCE: ${{ github.event.inputs.force || 'false' }}

      - name: Show output stats
        run: |
          echo "=== all_scores.json size ==="
          wc -c public/data/all_scores.json || echo "File not found"
          echo "=== Stock count ==="
          python3 -c "import json; d=json.load(open('public/data/all_scores.json')); stocks=d.get('all_stock_scores',d) if isinstance(d,dict) else d; print(f'{len(stocks)} stocks in all_scores.json'); sectors={}; [sectors.update({s.get('sector','\u5176\u4ed6'):sectors.get(s.get('sector','\u5176\u4ed6'),0)+1}) for s in (stocks if isinstance(stocks,list) else [])]; top5=sorted(sectors.items(),key=lambda x:-x[1])[:5]; print('Top 5 sectors:',top5)"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/all_scores.json
          git diff --staged --quiet || git commit -m "data: full scan update all_scores.json $(date '+%Y-%m-%d %H:%M CST')"
          git push

      - name: Sync to gh-pages
        run: |
          git fetch origin main gh-pages
          mkdir -p data
          git show origin/main:public/data/all_scores.json > data/all_scores.json
          git checkout -B gh-pages origin/gh-pages --force
          git add data/all_scores.json
          git diff --staged --quiet || git commit -m "data: sync all_scores.json from main scan"
          git push origin gh-pages
          git checkout @{-1}
