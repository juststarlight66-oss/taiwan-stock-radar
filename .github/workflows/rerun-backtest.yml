name: Rerun Backtest

on:
  workflow_dispatch:
  schedule:
    # Weekly Saturday 08:00 CST (UTC+8) = 00:00 UTC
    - cron: '0 0 * * 6'

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Checkout gh-pages (read backtest data)
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages-data

      - name: Checkout main (for scripts)
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-repo

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests pytz numpy pandas yfinance

      - name: Run backtest (all modes)
        run: |
          cd main-repo
          mkdir -p public/data
          cp ../gh-pages-data/data/predictions_history.json public/data/ 2>/dev/null || true
          python scripts/rerun_backtest.py all

      - name: Push results to gh-pages
        run: |
          cd gh-pages-data
          if [ -f ../main-repo/public/data/predictions_history.json ]; then
            cp ../main-repo/public/data/predictions_history.json data/predictions_history.json
          fi
          if [ -f ../main-repo/public/data/backtest_comparison.json ]; then
            cp ../main-repo/public/data/backtest_comparison.json data/backtest_comparison.json
          fi
          if [ -f ../main-repo/public/data/backtest_report.json ]; then
            cp ../main-repo/public/data/backtest_report.json data/backtest_report.json
          fi
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/predictions_history.json data/backtest_comparison.json data/backtest_report.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: rerun backtest results [skip ci]"
            git pull --rebase origin gh-pages || true
            git push origin HEAD:gh-pages
          fi
