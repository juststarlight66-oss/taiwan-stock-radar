name: Scan Quality Check

on:
  schedule:
    # \u6bcf\u65e5 16:00 \u53f0\u7063\u6642\u9593\uff08UTC 08:00\uff09\u57f7\u884c\uff0c\u78ba\u4fdd\u76e4\u5f8c\u8cc7\u6599\u5df2\u66f4\u65b0
    - cron: '0 8 * * 1-5'
  workflow_dispatch:  # \u4fdd\u7559\u624b\u52d5\u89f8\u767c

jobs:
  quality-check:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests pytz

      - name: Check TPEx API endpoints
        run: |
          python3 - <<'EOF'
          import requests, sys, warnings, datetime
          import pytz
          warnings.filterwarnings('ignore')

          # \u5224\u65b7\u53f0\u7063\u6642\u9593\u662f\u5426\u5df2\u904e\u76e4\u5f8c 15:30
          tz = pytz.timezone('Asia/Taipei')
          now_tw = datetime.datetime.now(tz)
          is_weekday = now_tw.weekday() < 5  # Mon-Fri
          is_after_close = (now_tw.hour > 15) or (now_tw.hour == 15 and now_tw.minute >= 30)

          if not is_weekday:
              print(f"SKIP: \u975e\u4ea4\u6613\u65e5\uff08{now_tw.strftime('%Y-%m-%d %H:%M')} \u53f0\u7063\u6642\u9593\uff09\uff0c\u7565\u904e API \u6aa2\u67e5")
              sys.exit(0)

          if not is_after_close:
              print(f"SKIP: \u76e4\u524d/\u76e4\u4e2d\uff08{now_tw.strftime('%Y-%m-%d %H:%M')} \u53f0\u7063\u6642\u9593\uff0c\u672a\u904e 15:30\uff09\uff0c\u7565\u904e API \u6aa2\u67e5")
              sys.exit(0)

          print(f"\u57f7\u884c API \u6aa2\u67e5\uff08{now_tw.strftime('%Y-%m-%d %H:%M')} \u53f0\u7063\u6642\u9593\uff0c\u4ea4\u6613\u65e5\u76e4\u5f8c\uff09")

          ENDPOINTS = {
              'TWSE STOCK_DAY_ALL':  'https://openapi.twse.com.tw/v1/exchangeReport/STOCK_DAY_ALL',
              'TPEx OTC daily':      'https://www.tpex.org.tw/openapi/v1/tpex_mainboard_daily_close_quotes',
              'TPEx Emerging daily': 'https://www.tpex.org.tw/openapi/v1/tpex_esb_daily_close_quotes',
          }

          failed = []
          for name, url in ENDPOINTS.items():
              try:
                  r = requests.get(url, timeout=15, verify=False,
                      headers={'User-Agent': 'Mozilla/5.0', 'Accept': 'application/json'})
                  if r.status_code == 200:
                      data = r.json()
                      count = len(data) if isinstance(data, list) else 0
                      if count == 0:
                          # 200 \u4f46\u7121\u8cc7\u6599\uff0c\u8996\u70ba warning \u4e0d fail
                          print(f"WARN {name}: 200 \u4f46\u56de\u50b3 0 \u7b46\uff08\u53ef\u80fd\u4eca\u65e5\u7121\u4ea4\u6613\uff09")
                      else:
                          print(f"OK   {name}: {count} \u7b46")
                  else:
                      msg = f"HTTP {r.status_code}"
                      failed.append(f"{name}: {msg}")
                      print(f"FAIL {name}: {msg}")
              except Exception as e:
                  failed.append(f"{name}: {e}")
                  print(f"FAIL {name}: {e}")

          if failed:
              print("\n=== API \u7570\u5e38\uff08\u76e4\u5f8c\u78ba\u8a8d\u5931\u6557\uff09===")
              for f in failed:
                  print(f"  - {f}")
              sys.exit(1)
          else:
              print("\nAll API checks passed.")
          EOF

      - name: Validate scan_market.py key functions
        run: |
          python3 - <<'EOF'
          import ast, sys

          with open('tasks/2255/scan_market.py', 'r') as f:
              src = f.read()

          # Parse AST to find defined functions
          tree = ast.parse(src)
          funcs = {n.name for n in ast.walk(tree) if isinstance(n, ast.FunctionDef)}

          required = ['fetch_tpex_day_all', 'analyze_technical', 'analyze_chips',
                      'analyze_fundamental', 'analyze_news', 'analyze_sentiment']
          missing = [fn for fn in required if fn not in funcs]

          if missing:
              print(f"FAIL: missing functions: {missing}")
              sys.exit(1)

          # Check version string
          if 'v8.0' in src or 'v7.0' in src or 'v9.0' in src:
              import re
              ver = re.search(r'\u7248\u672c\uff1a(v\S+)', src)
              print(f"OK version: {ver.group(1) if ver else 'unknown'}")

          # Check scanned_count warning threshold exists
          if '1500' in src or 'scanned_count' in src:
              print("OK scanned_count reference found")

          print(f"OK functions: {len(funcs)} defined, all required present")
          EOF
