name: Daily Market Scan

on:
  workflow_dispatch:
    inputs:
      scan_date:
        description: 'Scan date YYYYMMDD'
        required: false
        default: ''

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests pytz numpy pandas scikit-learn yfinance beautifulsoup4 lxml httpx

      - name: Create shared stub
        run: |
          mkdir -p /home/runner/work/tasks/shared
          echo "def run_backtest(stock_id, strategy='all', days=60): return {}" > /home/runner/work/tasks/shared/per_stock_backtest.py

      - name: "Pre-scan: check repo is clean"
        run: |
          if ! git diff --quiet; then
            echo "::error::Working directory is dirty before scan - aborting"
            git status --porcelain
            exit 1
          fi
          for f in public/data/intraday.json public/data/latest.json public/data/all_scores.json; do
            if [ -f "$f" ] && grep -q '^<<<<<<<' "$f" 2>/dev/null; then
              echo "::error::$f contains git conflict markers"
              exit 1
            fi
          done
          echo "Repo is clean."

      - name: Run scan_market.py
        run: |
          export PYTHONPATH="$PWD:$PWD/tasks"
          cd tasks/2255
          python3 scan_market.py

      - name: Run post_scan.py (generate reports + JSON)
        run: |
          export PYTHONPATH="$PWD:$PWD/tasks"
          cd tasks/2255
          python3 post_scan.py

      - name: Copy and update data files
        run: |
          mkdir -p public/data
          cp -v /tmp/scan_output/*.json public/data/ 2>/dev/null || true
          python3 -c "
          import json, glob, os, shutil
          files = glob.glob('public/data/*.json')
          print(f'Data files staged: {len(files)}')"

      - name: Generate intraday stub
        run: |
          mkdir -p public/data
          python3 -c "
          import json
          try:
              with open('public/data/latest.json') as f:
                  latest = json.load(f)
              top5 = [{k: v for k, v in r.items() if k in ('stock_id', 'name', 'score', 'close', 'change_pct')} for r in latest.get('top10', [])[:5]]
              with open('public/data/intraday.json', 'w') as f:
                  json.dump({'top5': top5, 'generated_at': f'$(date -u +%Y-%m-%dT%H:%M:%SZ)'}, f, ensure_ascii=False)
              print(f'Intraday stub written with {len(top5)} stocks.')
          except Exception as e:
              print(f'Intraday stub skipped: {e}')""

      - name: Run Strategy 3 (TPEx small-cap breakout)
        run: |
          export PYTHONPATH="$PWD:$PWD/tasks"
          python3 tasks/2255/strategy3.py 2>&1 || \
            echo "Strategy3 ran with warnings (continuing)."

      - name: Commit and push changes
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add public/data/ *.json
          git diff --cached --quiet || (
            git commit -m "scan($(date +%Y%m%d)): $(python3 -c 'import json; d=json.load(open("public/data/latest.json")); print(f\"{d[\"scanned_count\"]} stocks, Top 10 recommendations, updated all JSONs + report\")' 2>/dev/null || echo 'scan complete'))"
            git push
          )

      - name: Trigger deploy
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy.yml',
              ref: 'main'
            })