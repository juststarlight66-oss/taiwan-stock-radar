name: Scan Intraday

on:
  workflow_dispatch:
  # schedule disabled - replaced by Nebula trigger intraday-1230 (12:30 TWN)
  #   schedule:
  #     # \u6bcf\u4ea4\u6613\u65e5\u53f0\u7063\u6642\u9593 13:05 \u57f7\u884c (UTC 05:05)
  #     - cron: '5 5 * * 1-5'

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: "Pre-scan: check repo is clean"
        run: |
          if ! git diff --quiet; then
            echo "::error::Working directory is dirty before scan - aborting"
            git status --porcelain
            exit 1
          fi
          # Also check for existing conflict markers in output files
          for f in public/data/intraday.json public/data/latest.json; do
            if [ -f "$f" ] && grep -q '^<<<<<<<' "$f" 2>/dev/null; then
              echo "::error::$f contains git conflict markers"
              exit 1
            fi
          done
          echo "Repo is clean."

      - name: Run intraday scan
        run: |
          # Remove any existing directory before creating symlink
          # (ln -sf without -n creates link INSIDE directory, not replacing it)
          rm -rf /tmp/taiwan-stock-radar
          ln -s "$GITHUB_WORKSPACE" /tmp/taiwan-stock-radar
          python tasks/intraday/fetch_intraday.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit results to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/intraday*.json || true
          git diff --cached --quiet || git commit -m "data: intraday scan $(date +%Y%m%d-%H%M)"
          # Use explicit refspec -- actions/checkout leaves git in detached HEAD state
          git push origin HEAD:main

      - name: Deploy to GitHub Pages
        run: |
          cp public/data/intraday.json /tmp/intraday-tmp.json
          git fetch origin gh-pages
          git checkout -B gh-pages origin/gh-pages
          mkdir -p data
          cp /tmp/intraday-tmp.json data/intraday.json
          git add data/intraday.json
          git diff --cached --quiet || git commit -m "data: intraday scan $(date +%Y%m%d-%H%M)"
          # Use --force to handle concurrent pushes from deploy.yml
          git push --force origin gh-pages

      - name: "Capture predictions (intraday tracking)"
        run: |
          git checkout main  # back to main for script access
          # Wait a moment for gh-pages CDN propagation
          sleep 5
          python scripts/track_intraday_predictions.py capture

          # Push capture result to gh-pages
          if [ -f public/data/intraday_predictions_history.json ]; then
            cp public/data/intraday_predictions_history.json /tmp/intraday_hist.json
            git fetch origin gh-pages
            git checkout -B gh-pages origin/gh-pages
            cp /tmp/intraday_hist.json data/intraday_predictions_history.json
            git add data/intraday_predictions_history.json
            git diff --cached --quiet || git commit -m "data: intraday predictions capture $(date +%Y%m%d-%H%M)"
            git push --force origin gh-pages
          fi

      - name: "Send intraday email notification"
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          git checkout main
          # Read from gh-pages to get the deployed version
          cp data/intraday.json public/data/intraday.json 2>/dev/null || true
          python scripts/send_intraday_email.py send